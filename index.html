<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>橋梁点検ビューア</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="橋梁点検">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="local-caps.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="parser.js"></script>
<script src="dxf.js"></script>
<style>
  :root{
    color-scheme: light;
    --ink:#1d2329; --muted:#66707a; --line:#d9dee3; --bg:#eef1f4; --paper:#fff;
    --accent:#0a66d8; --accent-soft:rgba(10,102,216,.14); --hit:rgba(10,102,216,.10);
    --hl:#ff7a00; --red:#e0201b; --orig:#c2187a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select{-webkit-user-select:text;user-select:text}
  button{font:inherit;color:inherit}
  .hidden{display:none!important}
  .app{display:flex;flex-direction:column;position:fixed;inset:0}

  header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--paper);
    border-bottom:1px solid var(--line);flex:0 0 auto;min-height:52px}
  .brand{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
  .sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
  .sync i{width:8px;height:8px;border-radius:50%;background:#aab3bb;display:inline-block}
  .sync.ok i{background:#22a35a}.sync.wait i{background:#f0a400}.sync.local i{background:#8a63d2}.sync.err i{background:var(--red)}
  .nav{display:flex;align-items:center;gap:6px;margin-left:auto}
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;height:38px;min-width:38px;
    padding:0 12px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
  .btn:active{background:#e6ebf0}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:disabled{opacity:.45}
  .btn.danger{color:var(--red);border-color:#f0c4c2}
  .pageBtn{min-width:200px;justify-content:space-between;font-weight:600}
  .pageBtn .sub{color:var(--muted);font-weight:500;font-size:13px}

  /* ---------- home ---------- */
  #home main{flex:1;overflow:auto;padding:20px}
  .wrap{max-width:980px;margin:0 auto}
  .homehead{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
  .homehead h1{font-size:22px;margin:0}
  .homehead p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .bcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;cursor:pointer;position:relative}
  .bcard:active{background:#f6f8fa}
  .bcard h3{margin:0 0 4px;font-size:18px}
  .bcard .meta{color:var(--muted);font-size:13px;line-height:1.6}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 7px;background:#e8f0fb;color:var(--accent);margin-right:6px}
  .bcard .more{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;background:none;border-radius:8px;font-size:18px;color:var(--muted);cursor:pointer}
  .empty{background:var(--paper);border:1.5px dashed #c5cdd4;border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
  .notice{background:#fff8e6;border:1px solid #f3dca0;color:#7a5a00;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}

  /* ---------- viewer ---------- */
  .pop{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.18);padding:8px;z-index:30;display:none}
  .pop.open{display:block}
  #menu{top:56px;right:12px;width:min(420px,calc(100vw - 24px));max-height:calc(100% - 70px);overflow:auto}
  #expMenu{top:56px;right:12px;width:340px}
  .mgrp{padding:6px 8px 2px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.05em}
  .mitem{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;
    padding:11px 10px;border-radius:9px;font-size:15px;cursor:pointer;gap:10px}
  .mitem:active,.mitem.cur{background:var(--accent-soft)}
  .mitem span{color:var(--muted);font-size:13px;white-space:nowrap}
  .mitem .pen{color:var(--red);font-weight:600}

  #view{position:relative;flex:1 1 auto;overflow:hidden;touch-action:none;background:var(--bg)}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--paper);box-shadow:0 2px 14px rgba(0,0,0,.12)}
  #stage canvas{position:absolute;pointer-events:none}
  #ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  #ov .mk-flag,#ov .mk-text{pointer-events:visiblePainted}
  #ov.erase .mk{pointer-events:visiblePainted}
  #ov .hit{stroke:transparent;fill:none}
  #ov .sel .lbl-bg{stroke:var(--hl);stroke-width:.8}
  .spot{position:absolute;border-radius:2px;cursor:pointer}
  .spot.num{background:var(--hit);outline:1px solid rgba(10,102,216,.35)}
  .spot.num.has{outline-color:var(--orig)}
  .hidehits .spot.num{background:transparent;outline:none}
  .spot.active{background:rgba(255,122,0,.18)!important;outline:1.5px solid var(--hl)!important}
  .spot.num.manual{outline:1.5px dashed #16a34a;background:rgba(22,163,74,.12)}
  .linktool .spot{background:rgba(22,163,74,.10)!important;outline:1px solid rgba(22,163,74,.6)!important}
  .origtool .spot.num{background:rgba(194,24,122,.12);outline:1px solid rgba(194,24,122,.5)}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;pointer-events:none}

  .hint{position:absolute;left:84px;bottom:12px;background:rgba(29,35,41,.8);color:#fff;font-size:13px;
    padding:7px 11px;border-radius:9px;pointer-events:none;transition:opacity .4s;max-width:calc(100% - 100px)}

  #tools{position:absolute;left:10px;top:10px;z-index:15;background:var(--paper);border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.05);padding:6px;display:flex;flex-direction:column;gap:3px;width:62px;
    max-height:calc(100% - 20px);overflow:auto}
  .tool{width:50px;height:46px;border:0;border-radius:10px;background:none;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--muted);flex:0 0 auto}
  .tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tool.on{background:var(--accent-soft);color:var(--accent)}
  .tool.on svg{stroke:var(--accent)}
  .tool:disabled{opacity:.35}
  .tsep{height:1px;background:var(--line);margin:3px 4px;flex:0 0 auto}
  .swatches{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;flex:0 0 auto}
  .sw.on{box-shadow:0 0 0 2px var(--ink)}
  .wd{width:50px;height:28px;border:0;background:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .wd i{display:block;width:26px;border-radius:3px;background:var(--ink)}
  .wd.on{background:#eef1f4}
  #tools.ro .edit{display:none}

  #card{position:absolute;z-index:20;width:min(460px,44vw);background:var(--paper);border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.06);display:none;flex-direction:column;
    max-height:calc(100% - 24px);overflow:hidden}
  #card.open{display:flex}
  .chead{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px;cursor:grab;touch-action:none;border-bottom:1px solid var(--line);position:relative}
  .chead .t{font-weight:700;font-size:16px}
  .chead .pt{color:var(--muted);font-size:13px}
  .chead .x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:#eef1f4;font-size:20px;cursor:pointer;flex:0 0 auto}
  .badge{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--red);border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:2px}
  .grip{width:36px;height:4px;border-radius:2px;background:#cfd5db;position:absolute;left:50%;top:5px;transform:translateX(-50%)}
  .tabs{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
  .tab.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab.rel{border-style:dashed}
  .tab small{color:var(--orig);font-weight:600;margin-left:4px}
  .tab.cur small{color:#ffb3dc}
  .photo{position:relative;margin:10px 12px 0;border-radius:10px;overflow:hidden;background:#111;aspect-ratio:4/3;cursor:zoom-in;max-height:46vh}
  .photo img{width:100%;height:100%;object-fit:contain;display:block}
  .photo .nav2{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:20px;cursor:pointer}
  .photo .pv{left:8px}.photo .nx{right:8px}
  .origrow{display:flex;align-items:center;gap:8px;margin:10px 12px 0;padding:8px 10px;background:#fdf0f7;border-radius:10px}
  .origrow label{font-size:13px;font-weight:700;color:var(--orig);white-space:nowrap}
  .origrow input{flex:1;height:38px;border:1px solid #efc1da;border-radius:8px;padding:0 10px;font-size:18px;font-weight:600;letter-spacing:.06em;min-width:0}
  .origrow .btn{height:38px}
  .info{padding:10px 14px 10px;overflow:auto}
  .info table{border-collapse:collapse;width:100%;font-size:14px}
  .info th{text-align:left;color:var(--muted);font-weight:500;width:84px;padding:4px 0;vertical-align:top;white-space:nowrap}
  .info td{padding:4px 0}
  .dmg{display:flex;flex-wrap:wrap;gap:5px}
  .dmg b{font-weight:600;background:#fff3e6;color:#8a4300;border-radius:6px;padding:2px 7px;font-size:13.5px}
  .dmg i{font-style:normal;color:var(--muted);font-size:13px;padding:2px 0}
  .foot{color:var(--muted);font-size:12px;padding:0 14px 12px;display:flex;align-items:center;gap:8px}
  .foot .btn{height:32px;font-size:13.5px;margin-left:auto}

  #sheetBg{position:fixed;inset:0;background:rgba(20,25,30,.35);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  #sheetBg.open{display:flex}
  #sheet{background:var(--paper);border-radius:18px;width:min(580px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #sheet.small{width:min(360px,100%)}
  .sh-h{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
  .sh-h b{font-size:17px}
  .sh-b{padding:12px 16px 4px}
  .sh-f{display:flex;gap:8px;padding:12px 16px 16px;position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line)}
  .fl{margin-bottom:12px}
  .fl>label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select, option{color:#1d2329;background-color:#fff}
  select option:checked{background:#dbe8fb;color:#1d2329}
  .in{height:42px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:16px;background:#fff;min-width:0}
  .in.big{height:52px;font-size:24px;font-weight:700;letter-spacing:.08em;text-align:center;width:100%}
  textarea.in{height:auto;min-height:64px;padding:8px 10px;width:100%;resize:vertical}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;height:36px;padding:0 13px;font-size:14.5px;cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip:disabled{opacity:.45}
  .grade .chip{width:40px;padding:0;font-weight:700}
  .dmgrow{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .dmgrow select{flex:1 1 180px}
  .rm{width:34px;height:34px;border:0;border-radius:50%;background:#f3f4f6;font-size:18px;cursor:pointer;flex:0 0 auto}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumb{position:relative;width:84px;height:63px;border-radius:8px;overflow:hidden;background:#ddd}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
  .addph{width:84px;height:63px;border:1.5px dashed #b9c2ca;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;cursor:pointer;text-align:center}
  .preview{font-size:12.5px;background:#fafbfc;border:1px dashed var(--line);border-radius:9px;padding:8px 10px;white-space:pre-line;color:var(--red);line-height:1.5}
  .origs{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
  .origs span{font-size:14px;font-weight:600}
  .profiles{display:grid;gap:8px}
  .prof{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;background:#fff}
  .prof.on{border-color:var(--accent);background:#f3f8ff}
  .prof:disabled{opacity:.5;cursor:default}
  .prof b{display:block;font-size:15px}
  .prof small{color:var(--muted);font-size:12.5px}
  .filebox{display:flex;align-items:center;gap:10px;border:1.5px dashed #b9c2ca;border-radius:12px;padding:12px;cursor:pointer;background:#fafbfc}
  .filebox.ok{border-style:solid;border-color:#9fd3b2;background:#f2fbf5}
  .filebox b{font-size:14.5px}
  .filebox small{display:block;color:var(--muted);font-size:12.5px;word-break:break-all}
  .prog{font-size:14px;color:var(--muted);padding:10px 0}
  .bar{height:6px;border-radius:3px;background:#e6ebf0;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .summary{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;background:#f6f8fa;border-radius:10px;padding:10px 12px}
  .summary dt{color:var(--muted)} .summary dd{margin:0;font-weight:600}
  .warn{color:#9a5b00;font-size:13px;margin-top:8px}

  #lb{position:fixed;inset:0;background:#000;z-index:60;display:none;touch-action:none;overflow:hidden}
  #lb.open{display:block}
  #lb img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
  #lb .x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;z-index:2;cursor:pointer}
  #lb .cap{position:absolute;left:14px;top:16px;color:#fff;font-size:15px;z-index:2;text-shadow:0 1px 3px #000}

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(29,35,41,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
  #toast.on{opacity:1}
  #busy{position:fixed;inset:0;background:rgba(255,255,255,.65);z-index:80;display:none;align-items:center;justify-content:center;font-size:15px;font-weight:600;text-align:center;padding:20px}
  #busy.on{display:flex}

  @media (orientation:portrait){ .photo{max-height:28vh} #card{max-height:58%} }
  @media (max-width:760px){
    #card{width:calc(100vw - 16px)!important;left:8px!important;right:auto!important;top:auto!important;bottom:8px!important;max-height:62%}
    .pageBtn{min-width:0} .brand small,.sync span{display:none}
  }
</style>
</head>
<body>
<!-- ================= 橋一覧 ================= -->
<div class="app" id="home">
  <header>
    <div class="brand">橋梁点検ビューア<small>損傷図＋写真台帳</small></div>
    <div class="sync" id="homeSync"><i></i><span>接続中…</span></div>
    <div class="nav"><button class="btn" id="camBtn">カメラ表</button><button class="btn primary" id="addBtn">＋ 橋を追加</button></div>
  </header>
  <main><div class="wrap">
    <div class="notice hidden" id="homeNotice"></div>
    <div class="homehead"><div><h1>橋梁一覧</h1><p>損傷図と写真台帳のPDFを追加すると、iPadで点検に使えるビューアになります。</p></div></div>
    <div class="grid" id="blist"></div>
  </div></main>
</div>

<!-- ================= ビューア ================= -->
<div class="app hidden" id="viewer">
  <header>
    <button class="btn" id="backBtn" aria-label="一覧へ">‹ 一覧</button>
    <div class="brand" id="vBrand"></div>
    <div class="sync" id="sync"><i></i><span>接続中…</span></div>
    <div class="nav">
      <button class="btn" id="hitsBtn">番号枠</button>
      <button class="btn hidden" id="expBtn">書き出し</button>
      <button class="btn" id="fitBtn">全体</button>
      <button class="btn" id="prevBtn" aria-label="前のページ">‹</button>
      <button class="btn pageBtn" id="pageBtn"><span id="pageLbl"></span><span class="sub">▾</span></button>
      <button class="btn" id="nextBtn" aria-label="次のページ">›</button>
    </div>
  </header>
  <div id="view">
    <div id="stage"></div>
    <div class="loading hidden" id="vLoading">読み込み中…</div>
    <div id="tools" class="ui"></div>
    <div class="hint" id="hint"></div>
    <div id="card" class="ui">
      <div class="chead" id="chead"><div class="grip"></div>
        <div style="min-width:0"><div class="t" id="ct"></div><div class="pt" id="cpt"></div></div>
        <button class="x" id="cx" aria-label="閉じる">×</button>
      </div>
      <div class="tabs" id="ctabs"></div>
      <div class="photo" id="cphoto"><img id="cimg" alt="">
        <button class="nav2 pv" id="cpv" aria-label="前の写真">‹</button>
        <button class="nav2 nx" id="cnx" aria-label="次の写真">›</button></div>
      <div class="info" id="cinfo"></div>
      <div class="foot" id="cfoot"></div>
    </div>
  </div>
  <div id="menu" class="pop"></div>
  <div id="expMenu" class="pop"></div>
</div>

<div id="sheetBg"><div id="sheet"></div></div>
<div id="lb"><div class="cap" id="lbcap"></div><button class="x" id="lbx" aria-label="閉じる">×</button><img id="lbimg" alt=""></div>
<div id="toast"></div>
<div id="busy">処理中…</div>
<input type="file" id="fileIn" accept="image/*" multiple style="display:none">
<input type="file" id="pdfIn" accept="application/pdf,.pdf" style="display:none">

<script>
'use strict';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const PROFILES = BridgeParser.PROFILES;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(msg,ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),ms); }
function busy(msg){ const b=$('busy'); if(msg){ b.textContent=msg; b.classList.add('on'); } else b.classList.remove('on'); }
function newId(p='m'){ return p+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,20):(Date.now().toString(36)+Math.random().toString(36).slice(2))); }
function fmtDate(s){ if(!s) return ''; const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function stamp(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }

/* ======================= 機能（保存・写真・書き出し） ======================= */
let db=null, assets=null, downloads=null, userCap=null, myId=null, canWrite=true, capsReady=false;
const localBridges = new Map();   // 保存機能がない場合の一時データ
let bridges = new Map();          // bid -> bridge doc
let bridgesLoaded=false;

async function initCaps(){
  if(window.claude && claude.use){
    const [d,u,a,dl] = await Promise.all(['db','user','assets','downloads'].map(n=>claude.use(n).catch(()=>null)));
    db=d; userCap=u; assets=a; downloads=dl;
    if(userCap){ try{ myId=await userCap.id(); }catch(e){} try{ if(await userCap.can('data.write')===false) canWrite=false; }catch(e){} }
  }
  capsReady=true;
  if(downloads) $('expBtn').classList.remove('hidden');
  if(db){
    const timer=setTimeout(()=>{ if(!bridgesLoaded) setHomeSync('err','接続できません'); },10000);
    db.collection('bridges').onSnapshot(snap=>{
      bridges=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
      if(!snap.metadata.fromCache){ bridgesLoaded=true; clearTimeout(timer); setHomeSync('ok','このiPadに保存'); }
      renderHome(); if(route.bid && !V.bridge) route_();
    }, e=>{ clearTimeout(timer); setHomeSync('err','同期が停止しました'); });
  } else {
    setHomeSync('local','このブラウザのみ');
    bridgesLoaded=true;
    const n=$('homeNotice'); n.classList.remove('hidden');
    n.textContent='保存機能が使えない表示です。追加した橋はこの画面を閉じると消えます（Claudeにサインインした状態で開くと保存・共有できます）。';
  }
  if(!assets && db){ $('addBtn').classList.add('hidden'); }
  renderHome(); refreshToolState(); loadCameras();
  if(route.bid) route_();
}
function setHomeSync(cls,txt){ const e=$('homeSync'); e.className='sync '+cls; e.querySelector('span').textContent=txt; }
function blobUrl(id){ return window.LOCAL_CAPS?LOCAL_CAPS.assets.url(id):'/_blob/'+id; }

/* ======================= 画面遷移 ======================= */
const route={bid:null};
function parseHash(){ const m=location.hash.match(/^#b-([A-Za-z0-9-]+)$/); route.bid=m?m[1]:null; }
function route_(){
  parseHash();
  if(route.bid){
    const b=bridges.get(route.bid)||localBridges.get(route.bid);
    if(!b){ if(bridgesLoaded||!db){ if(capsReady){ toast('この橋は見つかりません'); location.hash=''; } } return; }
    if(V.bridge && V.bridge.id===b.id) return;
    $('home').classList.add('hidden'); $('viewer').classList.remove('hidden');
    openBridge(b);
  } else {
    closeBridge();
    $('viewer').classList.add('hidden'); $('home').classList.remove('hidden');
    renderHome();
  }
}
window.addEventListener('hashchange', route_);
$('backBtn').onclick=()=>{ location.hash=''; };
$('camBtn').onclick=()=>openCameraSettings();

function bridgeMenu(bid){
  const b=bridges.get(bid)||localBridges.get(bid); if(!b) return;
  openSheet(`<div class="sh-h"><b>${esc(b.name)}</b><button class="rm" style="margin-left:auto" id="bmx">×</button></div>
    <div class="sh-b"><div class="fl"><label>橋梁名</label><input class="in" id="bmName" style="width:100%" value="${esc(b.name)}"></div>
    <p style="color:var(--muted);font-size:13px">削除すると、この橋の損傷図・写真・書き込みがすべて消えます。元に戻せません。</p></div>
    <div class="sh-f"><button class="btn danger" id="bmDel">この橋を削除</button><button class="btn primary" id="bmSave" style="margin-left:auto">名前を保存</button></div>`,'small');
  $('bmx').onclick=closeSheet;
  $('bmSave').onclick=async()=>{ const n=$('bmName').value.trim(); if(!n) return; closeSheet();

  $('bmDel').onclick=()=>{ openSheet(`<div class="sh-h"><b>本当に削除しますか？</b></div><div class="sh-b"><p>「${esc(b.name)}」と、その書き込み・写真をすべて削除します。</p></div>
      <div class="sh-f"><button class="btn" id="dNo" style="margin-left:auto">やめる</button><button class="btn danger" id="dYes">削除する</button></div>`,'small');

async function deleteBridge(b){
  if(b.local){ localBridges.delete(b.id); renderHome(); return; }
  busy('削除中…');
  try{
    try{ const s=await db.collection(`bridges/${b.id}/marks`).get(); for(const d of s.docs){ const m=d.data(); for(const ph of (m.photos||[])){ try{ await assets.delete(ph); }catch(e){} } await db.doc(`bridges/${b.id}/marks/${d.id}`).delete(); } }catch(e){}
    try{ const s=await db.collection(`bridges/${b.id}/orig`).get(); for(const d of s.docs) await db.doc(`bridges/${b.id}/orig/${d.id}`).delete(); }catch(e){}
    await db.doc('bridges/'+b.id).delete();
    for(const id of [b.diaAsset,b.dataAsset,...(b.sheets||[])].filter(Boolean)){ try{ await assets.delete(id); }catch(e){} }
    toast('削除しました');
  }catch(e){ toast('削除できませんでした（'+((e&&e.code)||'エラー')+'）',4000); }
  finally{ busy(); }
}

async function saveBridge(name){
  const st=addState, r=st.result;
  const bid=newId('b');
  const spans=[...new Set(r.pages.flatMap(p=>p.span.split('・')).filter(Boolean))].sort((a,b)=>(parseFloat(a)||0)-(parseFloat(b)||0)||String(a).localeCompare(b)).join('・');
  const data={v:1, profile:st.profile, bridge:name, pages:r.pages, photos:r.photos, sprite:{cellW:r.sprite.cellW,cellH:r.sprite.cellH,cols:r.sprite.cols,rows:r.sprite.rows}};
  const counts={pages:r.pages.length, photos:r.photos.length, spans}; if(r.code) data.code=r.code;
  $('rSave').disabled=true; $('rBack').disabled=true;
  if(!db||!assets){
    const b={id:bid, local:true, name, profile:st.profile, counts, createdAt:new Date().toISOString(),
      src:{dia:r.pages.some(p=>p.svgText)?null:URL.createObjectURL(new Blob([st.files.dia],{type:'application/pdf'})), sheets:r.sprite.sheets.map(s=>URL.createObjectURL(s)), data}};
    localBridges.set(bid,b); addState=null; closeSheet(); location.hash='#b-'+bid; return;
  }
  const prog=$('aprog'); prog.innerHTML='<div class="prog"><span id="aptxt">保存しています…</span><div class="bar"><i id="apbar"></i></div></div>';
  const total=r.sprite.sheets.length+2; let done=0; const tick=t=>{ done++; $('aptxt').textContent=t; $('apbar').style.width=(100*done/total)+'%'; };
  const up=async(blob,type)=>{ for(let k=0;;k++){ try{ return await assets.upload(blob,{type}); }catch(e){ if(k<4&&e&&(e.code==='store_unavailable'||e.code==='rate_limited'||e.code==='upstream_error')){ await new Promise(r=>setTimeout(r,1500*(k+1))); continue; } throw e; } } };
  const uploaded=[];
  try{
    const isSvg=r.pages.some(p=>p.svgText); let dia=null; if(!isSvg){ dia=await up(new Blob([st.files.dia]),'application/pdf'); uploaded.push(dia.id); } tick('損傷図を保存しました');
    const sheets=[]; for(let i=0;i<r.sprite.sheets.length;i++){ const s=await up(r.sprite.sheets[i],'image/jpeg'); uploaded.push(s.id); sheets.push(s.id); tick(`写真を保存中 ${i+1}/${r.sprite.sheets.length}`); }
    const dj=await up(new Blob([JSON.stringify(data)],{type:'application/json'}),'application/json'); uploaded.push(dj.id); tick('仕上げています…');
    await db.doc('bridges/'+bid).set({name, code:r.code||'', profile:st.profile, diaAsset:dia?dia.id:null, dataAsset:dj.id, sheets, counts, createdAt:new Date().toISOString(), by:myId||null, v:1});
    addState=null; closeSheet(); toast('保存しました'); location.hash='#b-'+bid;
  }catch(e){
    for(const id of uploaded){ try{ await assets.delete(id); }catch(_){} }
    prog.innerHTML=`<div class="warn">保存できませんでした（${esc((e&&e.code)||e&&e.message||'エラー')}）。もう一度お試しください。</div>`;
    $('rSave').disabled=false; $('rBack').disabled=false;
  }
}

const view=$('view'), stage=$('stage');
const V={bridge:null, data:null, pdf:null, urls:null, cur:0, unsub:[], server:new Map(), orig:new Map(), sheetImgs:{}, photoUrls:new Map()};
let T={x:0,y:0,s:1}, showHits=true, mode='connecting';
let card={kind:'ledger', ids:[], idx:0};

async function openBridge(b){
  closeBridge();
  V.bridge=b; $('vBrand').textContent=b.name; $('vLoading').classList.remove('hidden'); stage.innerHTML='';
  V.outKey='outbox:'+b.id; try{ V.outbox=JSON.parse(store.get(V.outKey)||'{}')||{}; }catch(e){ V.outbox={}; }
  try{
    let data, diaBuf;
    if(b.local){ data=b.src.data; diaBuf=b.src.dia?await fetch(b.src.dia).then(r=>r.arrayBuffer()):null; V.urls={sheets:b.src.sheets}; }
    else {
      if(window.LOCAL_CAPS) await LOCAL_CAPS.assets.preload([b.dataAsset,b.diaAsset,...(b.sheets||[])].filter(Boolean));
      [data, diaBuf]=await Promise.all([fetch(blobUrl(b.dataAsset)).then(r=>{ if(!r.ok) throw new Error('data '+r.status); return r.json(); }),
        b.diaAsset?fetch(blobUrl(b.diaAsset)).then(r=>{ if(!r.ok) throw new Error('pdf '+r.status); return r.arrayBuffer(); }):Promise.resolve(null)]);
      V.urls={sheets:(b.sheets||[]).map(blobUrl)};
    }
    if(V.bridge!==b) return;
    V.data=data; V.pdf=diaBuf?await pdfjsLib.getDocument({data:diaBuf, isEvalSupported:false}).promise:null;
  }catch(e){ console.error(e); $('vLoading').textContent='読み込めませんでした（'+(e.message||e)+'）'; return; }
  $('vLoading').classList.add('hidden');
  buildTools();
  const saved=+store.get('dia-page:'+b.id);
  showPage(Number.isInteger(saved)&&saved>=0&&saved<V.data.pages.length&&store.get('dia-page:'+b.id)!=null?saved:getOrder()[0]);
  subscribe();
  const h=$('hint'); h.textContent='写真番号をタップで写真表示 ・ ピンチで拡大 ・ 左のツールで書き込み'; h.style.opacity=1; setTimeout(()=>h.style.opacity=0,6000);
}
function closeBridge(){
  V.unsub.forEach(u=>{ try{u();}catch(e){} }); V.unsub=[];
  for(const u of V.photoUrls.values()) URL.revokeObjectURL(u);
  Object.assign(V,{bridge:null,data:null,pdf:null,server:new Map(),orig:new Map(),sheetImgs:{},photoUrls:new Map()});
  undoStack.length=0; closeCard(); closeSheet(); if(renderTask){ try{renderTask.cancel();}catch(e){} }
}
function subscribe(){
  const b=V.bridge;
  if(!db||b.local){ setMode('local'); return; }
  let first=true;
  const timer=setTimeout(()=>{ if(first) setMode('err','接続できません（端末に一時保存）'); },10000);
  V.unsub.push(db.collection(`bridges/${b.id}/marks`).onSnapshot(s=>{
    if(V.bridge!==b) return; V.server=new Map(s.docs.map(d=>[d.id,d.data()]));
    if(!s.metadata.fromCache){ first=false; clearTimeout(timer); setMode('ok'); flush(); }
    renderMarks(); updateSync();
  }, e=>{ clearTimeout(timer); setMode('err','同期が停止しました（端末に一時保存）'); }));
  flush();
}

/* ======================= 保存（送信待ちキュー） ======================= */
// outbox: key -> {col:'marks'|'orig', id, op:'set'|'del', data}
function persistOutbox(){ store.set(V.outKey, JSON.stringify(V.outbox)); }
function merged(col){
  const m=new Map(col==='marks'?V.server:V.orig);
  for(const e of Object.values(V.outbox||{})){ if(e.col!==col) continue; if(e.op==='del') m.delete(e.id); else m.set(e.id,e.data); }
  return m;
}
function allMarks(){ return merged('marks'); }
function pageMarks(pi){ return [...allMarks().values()].filter(m=>m.page===pi).sort((a,b)=>(a.at||'').localeCompare(b.at||'')); }
function getMark(id){ return allMarks().get(id); }
function queue(col,id,op,data){ V.outbox[col+':'+id]={col,id,op,data}; persistOutbox(); updateSync(); flush(); }
const undoStack=[];
function commit(before, after, {noUndo}={}){
  if(!noUndo) undoStack.push({before:before?structuredClone(before):null, after:after?structuredClone(after):null});
  if(undoStack.length>100) undoStack.shift();
  if(after){ after.updatedAt=new Date().toISOString(); queue('marks',after.id,'set',after); }
  else if(before) queue('marks',before.id,'del');
  renderMarks(); refreshToolState();
}
function undo(){
  const u=undoStack.pop(); if(!u) return;
  if(false){ if(u.before) queue('orig','p'+u.orig,'set',{v:u.before,by:myId||null,at:new Date().toISOString()}); else queue('orig','p'+u.orig,'del'); renderMarks(); markSpots(); if(card.kind==='ledger') renderOrigRow(); }
  else if(u.before) commit(null, structuredClone(u.before), {noUndo:true});
  else if(u.after) commit(u.after, null, {noUndo:true});
  refreshToolState(); toast('元に戻しました');
}
let flushing=false, retryT=null;
async function flush(){
  const b=V.bridge; if(!db||!b||b.local||flushing) return;
  flushing=true;
  try{
    for(const k of Object.keys(V.outbox)){
      const e=V.outbox[k]; const path=`bridges/${b.id}/${e.col}/${e.id}`;
      try{
        if(e.op==='set') await db.doc(path).set(e.data); else await db.doc(path).delete();
        if(V.outbox[k]===e){ delete V.outbox[k]; persistOutbox(); }
      }catch(err){
        const c=err&&err.code;
        if(c==='invalid_argument'){ canWrite=false; setMode('err','保存できません（閲覧のみ）'); refreshToolState(); break; }
        if(c==='quota_exceeded'){ setMode('err','保存容量が上限です'); break; }
        if(c==='revoked'){ setMode('local'); break; }
        clearTimeout(retryT); retryT=setTimeout(()=>{retryT=null;flush();},15000); break;
      }
    }
  } finally { flushing=false; updateSync(); }
}
window.addEventListener('online', ()=>flush());
function setMode(m,label){ mode=m; updateSync(label); }
function updateSync(label){
  const el=$('sync'), n=Object.keys(V.outbox||{}).length; el.className='sync';
  let txt;
  if(mode==='local'){ el.classList.add('local'); txt='この端末に保存'; }
  else if(mode==='err'){ el.classList.add('err'); txt=label||'保存エラー'; }
  else if(mode==='connecting') txt='接続中…';
  else if(n){ el.classList.add('wait'); txt=`未送信 ${n}件`; }
  else { el.classList.add('ok'); txt='保存済み'; }
  el.querySelector('span').textContent=txt;
}

const isHK=()=>V.data&&V.data.profile==='hokkaido';
function numKey(point,num){ return isHK()?String(+num):point+'|'+num; }
let _numMap=null, _numMapData=null;
function idsFor(point,nums){ if(_numMapData!==V.data){ _numMap=new Map(V.data.photos.map(p=>[numKey(p.point,p.num),p.id])); _numMapData=V.data; }
  return nums.map(n=>_numMap.get(numKey(point,n))); }
function pageSpots(pi){
  const p=V.data.pages[pi], links=pageMarks(pi).filter(m=>m.type==='link'), out=[];
  p.spots.forEach((s,si)=>{ if(links.some(l=>l.base===si)) return; out.push({...s, src:'base', si}); });
  for(const l of links){
    const nums=splitNums(l.nums); if(!nums.length) continue;
    const ids=idsFor(l.point||'',nums), r=l.rect, w=(r[2]-r[0])/nums.length, okIds=[], rects=[];
    nums.forEach((n,k)=>{ if(ids[k]!=null){ okIds.push(ids[k]); rects.push([r[0]+w*k,r[1],r[0]+w*(k+1),r[3]]); } });
    if(okIds.length) out.push({ids:okIds, nums:rects, line:r, point:l.point||'', src:'link', markId:l.id, base:l.base});
  }
  return out;
}

function fit(){
  if(!V.data) return;
  const p=V.data.pages[V.cur], vw=view.clientWidth, vh=view.clientHeight, padL=78, pad=10;
  const s=Math.min((vw-padL-pad)/p.w,(vh-pad*2)/p.h);
  T={s, x:padL+(vw-padL-pad-p.w*s)/2, y: vh>vw ? pad : (vh-p.h*s)/2}; apply();
}
function fitScale(){ const p=V.data.pages[V.cur]; return Math.min((view.clientWidth-88)/p.w,(view.clientHeight-20)/p.h); }
function apply(){ stage.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.s})`; scheduleHi(); }
function clampT(t){ const min=fitScale()*0.6; t.s=Math.max(min,Math.min(t.s,16)); return t; }
function zoomAt(cx,cy,ns){ ns=clampT({s:ns}).s; T.x=cx-(cx-T.x)*ns/T.s; T.y=cy-(cy-T.y)*ns/T.s; T.s=ns; apply(); }
function toPage(cx,cy){ const r=view.getBoundingClientRect(); return {x:(cx-r.left-T.x)/T.s, y:(cy-r.top-T.y)/T.s}; }
let lastVW=0, lastVH=0;
function refitIfChanged(){ if(!V.data) return; const w=view.clientWidth, h=view.clientHeight; if(w!==lastVW||h!==lastVH){ lastVW=w; lastVH=h; fit(); } }

function scheduleHi(){ clearTimeout(hiTimer); hiTimer=setTimeout(renderHi,260); }
async function renderHi(){
  const cv=$('cvHi'); if(!cv||!pageObj||!V.data) return;
  const p=V.data.pages[V.cur], dpr=Math.min(window.devicePixelRatio||1,3), sc=T.s*dpr;
  if(sc<=baseScale*1.05){ cv.style.display='none'; return; }
  const vw=view.clientWidth, vh=view.clientHeight;
  let rx=Math.max(0,-T.x/T.s), ry=Math.max(0,-T.y/T.s), rx1=Math.min(p.w,(vw-T.x)/T.s), ry1=Math.min(p.h,(vh-T.y)/T.s);
  if(rx1<=rx||ry1<=ry) return;
  let s=sc; const maxPx=5e6; if((rx1-rx)*(ry1-ry)*s*s>maxPx) s=Math.sqrt(maxPx/((rx1-rx)*(ry1-ry)));
  const off=renderHi._off||(renderHi._off=document.createElement('canvas')); off.width=Math.ceil((rx1-rx)*s); off.height=Math.ceil((ry1-ry)*s);
  const vp=pageObj.getViewport({scale:s, rotation:p.rotation});
  if(hiTask){ try{hiTask.cancel();}catch(e){} }
  const pageAt=V.cur;
  hiTask=pageObj.render({canvasContext:off.getContext('2d'), viewport:vp, transform:[1,0,0,1,-rx*s,-ry*s]});
  try{ await hiTask.promise; }catch(e){ return; }
  if(V.cur!==pageAt) return;
  cv.width=off.width; cv.height=off.height; cv.getContext('2d').drawImage(off,0,0); off.width=off.height=1;
  Object.assign(cv.style,{display:'block',left:rx+'px',top:ry+'px',width:(rx1-rx)+'px',height:(ry1-ry)+'px'});
}

function half(s){ return String(s||'').replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); }
const CAMTOK=/^[A-Za-z_]{0,8}\d{2,}$/;
function camTokens(text){
  const s=half(text).replace(/[，、・\/]/g,',').replace(/[～〜~－ー]/g,'~').trim();
  if(!s) return null;
  const out=[];
  for(let part of s.split(/[,\s]+/).filter(Boolean)){
    const r=part.match(/^([A-Za-z_]{0,8})(\d+)~([A-Za-z_]{0,8})?(\d+)$/);
    if(r){ const pre=r[1], a=r[2], b0=r[4], b=b0.length<a.length?a.slice(0,a.length-b0.length)+b0:b0, na=+a, nb=+b;
      if(nb>=na && nb-na<=50){ for(let k=na;k<=nb;k++) out.push(pre+String(k).padStart(a.length,'0')); continue; } return null; }
    if(!CAMTOK.test(part)) return null;
    const prev=out[out.length-1], pm=prev&&prev.match(/^([A-Za-z_]*)(\d+)$/);
    if(pm&&/^\d+$/.test(part)){ if(part.length<pm[2].length) part=pm[1]+pm[2].slice(0,pm[2].length-part.length)+part; else if(pm[1]) part=pm[1]+part; }
    out.push(part);
  }

}

    cap.set(t.key,n); });
  const orphans=[];
  const cams=[...marks.filter(isCamText).map(m=>({m,r:textRect(m)})), ...(p.cams||[]).filter(c=>camTokens(c.text)).map(c=>({m:{text:c.text},r:c.rect}))].sort((a,b)=>a.r[1]-b.r[1]||a.r[0]-b.r[0]);
  const cost=(r,t)=>{ const ch=r[3]-r[1], ov=Math.min(r[3],t.rect[3])-Math.max(r[1],t.rect[1]);
    if(ov>=ch*0.4){ const dx=Math.max(0,r[0]-t.rect[2],t.rect[0]-r[2]); return dx<=220?dx*0.7:1e9; }
    const dx=Math.max(0,r[0]-t.rect[2],t.rect[0]-r[2]), dy=Math.max(0,r[1]-t.rect[3],t.rect[1]-r[3]), d=Math.hypot(dx,dy); return d<=CAM_MAX?Math.hypot(dx,dy*2.5)+8:1e9; };
  // 近い組み合わせから順に、受け入れ数の範囲で割り当て
  const pairs=[]; cams.forEach((c,ci)=>targets.forEach(t=>{ const v=cost(c.r,t); if(v<1e9) pairs.push([v,ci,t]); }));
  pairs.sort((a,b)=>a[0]-b[0]);
  const asg=new Array(cams.length).fill(null), used=new Map();
  for(const [v,ci,t] of pairs){ if(asg[ci]) continue; const u=used.get(t.key)||0; if(u>=cap.get(t.key)) continue; asg[ci]=t; used.set(t.key,u+camTokens(cams[ci].m.text).length); }
  // 余った撮影No：一番近い見出しへ（写真より多い場合）
  cams.forEach((c,ci)=>{ if(asg[ci]) return; let best=null,bd=1e9; for(const t of targets){ const v=cost(c.r,t); if(v<bd){ bd=v; best=t; } } asg[ci]=best; });
  // 位置順にまとめる
  cams.forEach((c,ci)=>{ const t=asg[ci], toks=camTokens(c.m.text);
    if(t){ if(!map.has(t.key)) map.set(t.key,[]); map.get(t.key).push({toks,y:c.r[1],x:c.r[0]}); links.push({r:c.r,t}); }
    else { links.push({r:c.r,t:null}); orphans.push({toks,x:c.r[0],y:c.r[1]}); } });
  for(const [k,arr] of map) map.set(k, arr.sort((a,b)=>a.y-b.y||a.x-b.x).flatMap(o=>o.toks));
  marks.filter(m=>m.type==='flag'&&m.camNo).forEach(m=>{ const k='F'+m.id; if(!map.has(k)) map.set(k,[]); map.get(k).unshift(...(camTokens(m.camNo)||[m.camNo])); });
  return {map, links, orphans};
}

    <button class="mitem" data-x="pdf">損傷図PDF（書き込み入り・全ページ）<span>PDF</span></button>
    <button class="mitem" data-x="png">このページの画像<span>PNG</span></button>
    <button class="mitem" data-x="json">書き込みデータ（バックアップ）<span>JSON</span></button>`;
  m.classList.toggle('open'); m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ m.classList.remove('open'); doExport(b.dataset.x); });
};
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function renderPageCanvas(pi,scale){
  const p=V.data.pages[pi];
  const c=document.createElement('canvas'); c.width=Math.ceil(p.w*scale); c.height=Math.ceil(p.h*scale);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
  if(p.svgText){ const u=URL.createObjectURL(new Blob([p.svgText],{type:'image/svg+xml'})); try{ x.drawImage(await loadImg(u),0,0,c.width,c.height); } finally { URL.revokeObjectURL(u); } }
  else { const pg=await V.pdf.getPage(pi+1), vp=pg.getViewport({scale,rotation:p.rotation}); await pg.render({canvasContext:x, viewport:vp}).promise; }
  const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('xmlns',SVGNS); s.setAttribute('viewBox',`0 0 ${p.w} ${p.h}`); s.setAttribute('width',c.width); s.setAttribute('height',c.height);
  const save=selId; selId=null; pageMarks(pi).forEach(m=>drawMark(m,s)); selId=save;
  s.querySelectorAll('.hit,[fill="transparent"],.ico,.camlink').forEach(e=>e.remove());
  if(s.childNodes.length){ const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'}));
    try{ x.drawImage(await loadImg(url),0,0,c.width,c.height); } finally { URL.revokeObjectURL(url); } }
  return c;
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function doExport(kind){
  if(!downloads){ toast('この表示では書き出しが使えません'); return; }
  const BR=V.bridge.name; busy('作成中…');
  try{
    let filename, data;
    if(kind==='hkxlsx'){ data=await buildHkXlsx(); filename=`${BR}_損傷シート用_${stamp()}.xlsx`; }
    else if(kind==='xlsx'){ data=await buildXlsx(); filename=`${BR}_写真整理_${stamp()}.xlsx`; }
    else if(kind==='csv'){ data=toCsv(csvRows()); filename=`${BR}_損傷一覧_${stamp()}.csv`; }
    else if(kind==='png'){ const c=await renderPageCanvas(V.cur,3); data=await new Promise(r=>c.toBlob(r,'image/png')); const p=V.data.pages[V.cur]; filename=`${BR}_損傷図_${p.span}径間_${p.title}_${stamp()}.png`; }
    else if(kind==='pdf'){
      if(!window.jspdf) await loadScript('lib/jspdf.umd.min.js');
      const {jsPDF}=window.jspdf; let doc=null;
      const ord=getOrder();
      for(let j=0;j<ord.length;j++){ const i=ord[j]; busy(`作成中… ${j+1}/${ord.length}`);
        const p=V.data.pages[i], c=await renderPageCanvas(i,2.6), img=c.toDataURL('image/jpeg',.9), o=p.w>p.h?'l':'p';
        if(!doc) doc=new jsPDF({orientation:o,unit:'pt',format:[p.w,p.h]}); else doc.addPage([p.w,p.h],o);
        doc.addImage(img,'JPEG',0,0,p.w,p.h); }
      data=doc.output('blob'); filename=`${BR}_損傷図_書き込み入り_${stamp()}.pdf`;
    }
    else { data=JSON.stringify({bridge:BR,exported:new Date().toISOString(),marks:[...allMarks().values()],orig:Object.fromEntries([...merged('orig')].map(([k,v])=>[k,v.v]))},null,1); filename=`${BR}_書き込み_${stamp()}.json`; }
    busy(); await downloads.save({filename,data});
  }catch(err){ busy(); const c=err&&err.code; if(c==='declined') return; toast('書き出しできませんでした'+(c?'（'+c+'）':''),4000); }
}

document.addEventListener('keydown',e=>{
  if($('sheetBg').classList.contains('open')){ if(e.key==='Escape'&&!addState) closeSheet(); return; }
  if(!V.data) return;
  if(e.target.closest('input,textarea')) return;
  if(e.key==='Escape'){ if($('lb').classList.contains('open')) $('lb').classList.remove('open'); else closeCard(); }
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){ e.preventDefault(); undo(); }
  if($('card').classList.contains('open')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')) step(e.key==='ArrowRight'?1:-1);
});

/* ======================= オフライン版：共有用データの書き出し・読み込み ======================= */
// ファイルの形：先頭16文字に見出しの長さ → 見出し(JSON) → 写真・図面のファイルを順に連結
const BK_MAGIC='KYORYO1';
async function exportBridgeFile(b){
  if(!window.LOCAL_CAPS) return;
  busy('書き出しを準備中…');
  try{
    const docs=await db._dump('bridges/'+b.id);
    const ids=new Set([b.diaAsset,b.dataAsset,...(b.sheets||[])].filter(Boolean));
    for(const [k,v] of docs){ if(/\/marks\//.test(k)) for(const ph of (v&&v.photos)||[]) ids.add(ph); }
    let cams=null; try{ const d=await db.doc('settings/cameras').get(); if(d.exists) cams=d.data(); }catch(e){}
    const files=[], parts=[];
    for(const id of ids){ const bl=await assets.get(id); if(!bl) continue; files.push({id,type:bl.type,size:bl.size}); parts.push(bl); }
    const head=JSON.stringify({magic:BK_MAGIC,bridge:b.id,name:b.name,exported:new Date().toISOString(),docs,files,cams});
    const hb=new TextEncoder().encode(head);
    const blob=new Blob([String(hb.length).padStart(16,'0'),hb,...parts],{type:'application/octet-stream'});
    busy();
    await downloads.save({filename:`${b.name||'橋'}_点検データ_${stamp()}.kyoryo`,data:blob});
  }catch(e){ busy(); if(e&&e.code==='declined') return; toast('書き出しできませんでした',4000); console.error(e); }
}
async function importBridgeFile(file){
  busy('読み込み中…');
  try{
    const len=parseInt(await file.slice(0,16).text(),10);
    if(!(len>0)) throw new Error('形式が違います');
    const head=JSON.parse(await file.slice(16,16+len).text());
    if(head.magic!==BK_MAGIC) throw new Error('形式が違います');
    let off=16+len;
    for(const f of head.files){ await assets._put(f.id,file.slice(off,off+f.size,f.type),f.type); off+=f.size; }
    // 同じ橋がすでにあれば書き込みを合わせる（同じ書き込みは新しい方を残す）
    let added=0, updated=0;
    for(const [k,v] of head.docs){
      const cur=await db.doc(k).get();
      if(!cur.exists){ await db._put(k,v); added++; continue; }
      if(k==='bridges/'+head.bridge) continue;   // 橋そのものの情報は手元のものを残す
      const a=cur.data(), t1=(a&&(a.updatedAt||a.at))||'', t2=(v&&(v.updatedAt||v.at))||'';
      if(t2>t1){ await db._put(k,v); updated++; }
    }
    if(head.cams){ const c=await db.doc('settings/cameras').get(); if(!c.exists||!((c.data().rows||[]).length)){ await db._put('settings/cameras',head.cams); loadCameras(); } }
    busy(); toast(`「${head.name}」を読み込みました（追加 ${added}・更新 ${updated}）`,4000);
  }catch(e){ busy(); toast('読み込めませんでした：'+(e&&e.message||'エラー'),5000); console.error(e); }
}
if(window.LOCAL_CAPS){
  // 一覧に「読み込み」ボタン
  const nav=$('camBtn').parentNode, ib=document.createElement('button'); ib.className='btn'; ib.id='impBtn'; ib.textContent='データ読み込み';
  nav.insertBefore(ib,$('camBtn'));
  const fi=document.createElement('input'); fi.type='file'; fi.style.display='none'; document.body.appendChild(fi);
  ib.onclick=()=>{ fi.value=''; fi.click(); }; fi.onchange=()=>{ if(fi.files[0]) importBridgeFile(fi.files[0]); };
  // 橋のメニューに「共有用に書き出す」
  const _bm=bridgeMenu;
  bridgeMenu=function(bid){ _bm(bid); const b=bridges.get(bid); if(!b) return; const f=document.querySelector('#sheet .sh-f'); if(!f) return;
    const x=document.createElement('button'); x.className='btn'; x.textContent='共有用に書き出す'; x.onclick=()=>{ closeSheet(); exportBridgeFile(b); }; f.insertBefore(x,f.children[1]||null);
    const p=document.querySelector('#sheet .sh-b'); if(p){ const n=document.createElement('p'); n.style.cssText='color:var(--muted);font-size:13px'; n.textContent='「共有用に書き出す」で作ったファイルを別のiPadで「データ読み込み」すると、損傷図・写真・書き込みを渡せます。同じ橋なら書き込みが合わさります。'; p.appendChild(n); } };
  // オフライン用の仕組みを登録
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    const hadCtl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg=>{ reg.update().catch(()=>{}); }).catch(e=>console.warn(e));
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(hadCtl){ toast('新しい版に更新しました。一覧に戻ったときに再読み込みしてください',6000); }
      else toast('オフラインでも使えるようになりました',3500);
    });
  }
}
